name: Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Install
      run: npm clean-install
    - name: Verify
      run: |
        npm run prepare
        # Fail if "npm run prepare" generated new changes in dist
        git update-index --refresh dist/* && git diff-index --quiet HEAD dist
    - name: Lint
      run: npm run all

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        version:
        - 'latest'
        - 'v0.4.21'
        - '0.4.21'
        - '0.4'
        # Skip macOS builds that would require GitHub API access
        exclude:
        - os: macos-latest
          version: 'latest'
        - os: macos-latest
          version: '0.4'
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup konjure
      uses: ./
      with:
        version: ${{ matrix.version }}

    - name: No boom
      run: konjure --version
